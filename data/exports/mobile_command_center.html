<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ball Knower Mobile Command Center</title>
    <style>
      :root {
        --bg: #0b1020;
        --card: #151c33;
        --text: #f3f5ff;
        --muted: #a8b3d8;
        --accent: #5ea1ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      main {
        max-width: 680px;
        margin: 0 auto;
        padding: 16px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.45rem;
      }
      .toolbar {
        display: grid;
        gap: 12px;
        margin-bottom: 14px;
      }
      button {
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: #001336;
        font-size: 1rem;
        font-weight: 700;
        padding: 14px;
        min-height: 48px;
      }
      .meta {
        color: var(--muted);
        font-size: 0.86rem;
      }
      .card {
        background: var(--card);
        border-radius: 14px;
        padding: 14px;
        margin-bottom: 12px;
        display: grid;
        gap: 10px;
      }
      .card h2 {
        margin: 0;
        font-size: 1.1rem;
      }
      .label {
        display: block;
        color: var(--muted);
        font-size: 0.8rem;
        margin-bottom: 4px;
      }
      .value {
        margin: 0;
        line-height: 1.35;
      }
      .copy-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: start;
      }
      .copy-btn {
        background: #2a365f;
        color: #ecf1ff;
        font-size: 0.86rem;
        min-width: 88px;
        padding: 10px;
      }
      .status {
        min-height: 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>🏈 Ball Knower — Mobile Command Center</h1>
      <section class="toolbar">
        <button id="runEngineBtn">Run Engine</button>
        <div class="meta" id="generatedAt">Loading latest run...</div>
        <div class="meta status" id="status"></div>
      </section>
      <section id="cards"></section>
    </main>

    <script>
      const labels = {
        views: "Best post for views",
        followers: "Best post for followers",
        shares: "Best post for shares",
      };

      async function copyText(value) {
        try {
          await navigator.clipboard.writeText(value);
          setStatus("Copied.");
        } catch (e) {
          setStatus("Copy failed. Long-press text to copy.");
        }
      }

      function row(label, value, copyable = false) {
        if (!copyable) {
          return `<div><span class="label">${label}</span><p class="value">${value}</p></div>`;
        }
        return `<div class="copy-row"><div><span class="label">${label}</span><p class="value">${value}</p></div><button class="copy-btn" data-copy="${encodeURIComponent(value)}">Copy</button></div>`;
      }

      function renderCards(data) {
        const cards = Object.entries(data.recommendations).map(([goal, rec]) => `
          <article class="card">
            <h2>${labels[goal]}</h2>
            ${row("Topic", rec.topic)}
            ${row("Hook", rec.hook, true)}
            ${row("Caption", rec.caption, true)}
            ${row("Hashtags", rec.hashtags, true)}
            ${row("Why selected", rec.why_selected)}
            ${row("Best window", rec.best_window)}
          </article>
        `).join("");
        document.getElementById("cards").innerHTML = cards;

        document.querySelectorAll(".copy-btn").forEach((btn) => {
          btn.addEventListener("click", () => copyText(decodeURIComponent(btn.dataset.copy)));
        });
      }

      function setStatus(message) {
        document.getElementById("status").textContent = message;
      }

      async function loadData() {
        const response = await fetch("/mobile_command_center.json?ts=" + Date.now());
        const data = await response.json();
        document.getElementById("generatedAt").textContent = "Last refresh: " + data.generated_at;
        renderCards(data);
      }

      document.getElementById("runEngineBtn").addEventListener("click", async () => {
        setStatus("Running engine...");
        try {
          await fetch("/run-engine", { method: "POST" });
          await loadData();
          setStatus("Engine refreshed.");
        } catch (e) {
          setStatus("Run failed. Use `python main.py mobile-refresh` then reload.");
        }
      });

      loadData().catch(() => setStatus("Could not load data. Run `python main.py mobile-refresh`."));
    </script>
  </body>
</html>
